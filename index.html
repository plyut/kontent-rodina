<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Сдача работ · Контент. Родина</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Unbounded:wght@700;800&display=swap">
<style>
/* Сдача работ: шапка форума → статус приёма → поиск по фамилии → дни и мероприятия → строка ребёнка открывает окно загрузки */
:root{
  --bg:#F2F5FB; --surface:#FFFFFF; --ink:#0D1530; --muted:#5A6380; --line:#E1E6F0;
  --navy:#0B1B4D; --navy2:#16307E; --red:#E11D2E; --accent:#1D4ED8;
  --ok:#0B7A4B; --ok-bg:#DCF4E8; --late:#8A5A00; --late-bg:#FFF0C9; --miss:#B4141F; --miss-bg:#FDE0E3;
  --display:"Unbounded","Arial Black",Arial,sans-serif; --body:"Manrope","Segoe UI",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;padding-bottom:env(safe-area-inset-bottom,0px)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px}

header{position:relative;overflow:hidden;background:linear-gradient(120deg,var(--navy),var(--navy2));color:#fff;padding-top:env(safe-area-inset-top,0px)}
header::before,header::after{content:"";position:absolute;right:-90px;width:360px;height:30px;transform:rotate(-26deg)}
header::before{top:34px;background:rgba(255,255,255,.12)} header::after{top:78px;background:var(--red)}
header .wrap{position:relative;z-index:1;padding-block:22px 28px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.75}
h1{font-family:var(--display);font-size:30px;line-height:1;margin:8px 0 6px}
h1 b{color:#FF5A68}
header p{margin:0;font-weight:600;opacity:.9}

main{display:flex;flex-direction:column;gap:14px;padding-block:16px 40px}
.status{border-radius:14px;padding:12px 14px;font-weight:700;font-size:15px;display:flex;gap:10px;align-items:center}
.status i{width:10px;height:10px;border-radius:50%;flex:none}
.status.open{background:var(--ok-bg);color:var(--ok)} .status.open i{background:var(--ok)}
.status.closed{background:var(--late-bg);color:var(--late)} .status.closed i{background:var(--late)}
.status.load{background:var(--surface);color:var(--muted);border:1px solid var(--line)} .status.load i{background:var(--line)}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:13px 15px;font-size:16px}
.how{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;font-size:15px;color:var(--muted)}
.how b{color:var(--ink)}

.dayh{font-family:var(--display);font-size:17px;color:var(--navy);margin:10px 4px 0}
.ev{background:var(--surface);border-radius:18px;box-shadow:0 1px 2px rgba(11,27,77,.06),0 4px 14px rgba(11,27,77,.06);overflow:hidden}
.ev h2{margin:0;padding:14px 16px 10px;font-size:17px;font-weight:800;line-height:1.25}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:12px 16px;min-height:56px}
.row:hover,.row:active{background:#F7F9FD}
.tag{border-radius:999px;padding:3px 10px;font-size:13px;font-weight:800;white-space:nowrap}
.k-stories{color:#D61F30;background:#FDE8EA} .k-photo{color:#1D4ED8;background:#E3ECFF} .k-text{color:#0B7A4B;background:#DCF4E8}
.k-video{color:#6D34D6;background:#EFE6FF} .k-trend{color:#B45309;background:#FDECD8} .k-other{color:#4A5468;background:#E8ECF3}
.who{min-width:0}
.who b{display:block;font-size:16px;font-weight:800}
.who span{display:block;font-size:13px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{font-size:13px;font-weight:800;border-radius:9px;padding:4px 9px;white-space:nowrap}
.st.ok{color:var(--ok);background:var(--ok-bg)} .st.late{color:var(--late);background:var(--late-bg)}
.st.open{color:var(--red);background:#FFF1F2} .st.miss{color:var(--miss);background:var(--miss-bg)}
.empty{text-align:center;color:var(--muted);font-weight:700;padding:28px 16px;background:var(--surface);border-radius:18px;border:1px dashed var(--line)}

/* окно загрузки */
.veil{position:fixed;inset:0;background:rgba(11,27,77,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;max-height:92vh;overflow:auto}
@media (min-width:600px){.veil{align-items:center}.sheet{border-radius:22px}}
.sheet h3{margin:0;font-family:var(--display);font-size:20px;color:var(--navy)}
.sheet .sub{color:var(--muted);font-weight:600;margin-top:-6px}
.me{background:#F2F5FB;border-radius:14px;padding:12px 14px;font-weight:700}
.me b{font-size:18px}
.pick{display:flex;align-items:center;justify-content:center;gap:10px;border:2px dashed #9AA6C2;border-radius:16px;padding:18px;font-weight:800;color:var(--navy);background:#FBFCFE}
.pick input{position:absolute;opacity:0;width:1px;height:1px}
.files{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.files li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:14px}
.files .n{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.files .s{color:var(--muted);font-weight:600}
.bar{grid-column:1/-1;height:6px;border-radius:3px;background:#E8ECF3;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.bar.done i{background:var(--ok)} .bar.err i{background:var(--miss)}
.btn{border:0;border-radius:14px;padding:15px;font-weight:800;font-size:16px}
.btn.main{background:var(--navy);color:#fff}
.btn.main:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--muted)}
.msg{border-radius:14px;padding:12px 14px;font-weight:700}
.msg.ok{background:var(--ok-bg);color:var(--ok)} .msg.late{background:var(--late-bg);color:var(--late)} .msg.err{background:var(--miss-bg);color:var(--miss)}
.warn{font-size:13px;color:var(--muted);font-weight:600;text-align:center}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="eyebrow">Всероссийский форум юных журналистов</div>
  <h1>Контент.<b>Родина</b></h1>
  <p>Сдача работ</p>
</div></header>

<main class="wrap">
  <div id="status" class="status load"><i></i><span>Проверяю, открыт ли приём…</span></div>
  <div class="how"><b>Как сдать:</b> найди своё задание, нажми на него, выбери файлы и нажми «Отправить». Время сдачи запишется само.</div>
  <input id="q" class="search" type="search" placeholder="Найди свою фамилию" autocomplete="off">
  <div id="list"><div class="empty">Загружаю задания…</div></div>
</main>

<div id="veil" class="veil" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-title">
    <h3 id="sh-title">Сдать работу</h3>
    <div class="sub" id="sh-event"></div>
    <div class="me" id="sh-me"></div>
    <label class="pick" id="pick">＋ Выбрать файлы<input id="file" type="file" multiple></label>
    <ul class="files" id="files"></ul>
    <div id="sh-msg"></div>
    <button class="btn main" id="send" type="button" disabled>Отправить</button>
    <div class="warn" id="sh-warn" hidden>Не закрывай страницу, пока идёт загрузка</div>
    <button class="btn ghost" id="close" type="button">Закрыть</button>
  </div>
</div>

<script>
const TYPES = { stories: "Сторис", photo: "Фото", text: "Текст", video: "Клип", trend: "Тренд", other: "Другое" };
const WEEK = ["воскресенье","понедельник","вторник","среда","четверг","пятница","суббота"];
let API = "", plan = null, live = false, current = null, chosen = [], busy = false;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const fmtDay = d => `${d.slice(8,10)}.${d.slice(5,7)}`;
const fmtDl = (dl, day) => !dl ? "без срока" : (dl.slice(0,10) === day ? "до " + dl.slice(11,16) : `до ${fmtDay(dl)} ${dl.slice(11,16)}`);
const mb = n => n >= 1e9 ? (n/1e9).toFixed(1) + " ГБ" : n >= 1e6 ? (n/1e6).toFixed(1) + " МБ" : Math.max(1, Math.round(n/1e3)) + " КБ";
const ST = { ok: "✓ Сдано", late: "Сдано с опозданием", miss: "Не сдано", open: "" };

async function getJson(url, ms = 8000) {
  const c = new AbortController(); const t = setTimeout(() => c.abort(), ms);
  try { const r = await fetch(url, { signal: c.signal, cache: "no-store" }); if (!r.ok) throw new Error(r.status); return await r.json(); }
  finally { clearTimeout(t); }
}
async function load() {
  try { API = (await getJson("config.json?t=" + Date.now())).api || ""; } catch (e) { API = ""; }
  if (API) {
    try { plan = await getJson(API + "/plan"); live = true; }
    catch (e) { live = false; }
  }
  if (!live) { try { plan = await getJson("plan.json?t=" + Date.now()); } catch (e) {} }
  const s = $("#status");
  s.className = "status " + (live ? "open" : "closed");
  s.querySelector("span").textContent = live ? "Приём работ открыт" : "Приём работ сейчас закрыт — попробуй чуть позже";
  render();
}

function render() {
  const list = $("#list");
  if (!plan || !plan.days || !plan.days.length) { list.innerHTML = `<div class="empty">Заданий пока нет</div>`; return; }
  const q = $("#q").value.trim().toLowerCase();
  let html = "";
  for (const d of plan.days) {
    let dayHtml = "";
    for (const ev of d.events) {
      const rows = ev.tasks.filter(t => !q || t.who.toLowerCase().includes(q));
      if (!rows.length) continue;
      dayHtml += `<section class="ev"><h2>${esc(ev.title)}</h2>` + rows.map(t => `
        <button class="row" type="button" data-id="${esc(t.id)}">
          <span class="tag k-${TYPES[t.type] ? t.type : "other"}">${esc(t.typeLabel || TYPES[t.type] || "Работа")}</span>
          <span class="who"><b>${esc(t.who)}${t.team ? ` · ${esc(t.team)} ком.` : ""}</b><span>${esc(fmtDl(t.deadline, d.day))}${t.what ? " · " + esc(t.what) : ""}</span></span>
          ${t.status !== "open" ? `<span class="st ${t.status}">${ST[t.status]}</span>` : `<span class="st open">Сдать</span>`}
        </button>`).join("") + `</section>`;
    }
    if (dayHtml) html += `<div class="dayh">${fmtDay(d.day)}, ${WEEK[new Date(d.day + "T12:00").getDay()]}</div>` + dayHtml;
  }
  list.innerHTML = html || `<div class="empty">Не нашли такую фамилию. Проверь, как она написана.</div>`;
}

function findTask(id) {
  for (const d of plan.days) for (const ev of d.events) for (const t of ev.tasks) if (t.id === id) return { t, ev, day: d.day };
  return null;
}
function openSheet(id) {
  const f = findTask(id); if (!f) return;
  current = f; chosen = [];
  $("#sh-event").textContent = `${fmtDay(f.day)} · ${f.ev.title}`;
  $("#sh-me").innerHTML = `<b>${esc(f.t.who)}</b><br>${esc(f.t.typeLabel)} · ${esc(fmtDl(f.t.deadline, f.day))}`;
  $("#sh-msg").innerHTML = live ? "" : `<div class="msg err">Приём сейчас закрыт. Попробуй позже.</div>`;
  $("#files").innerHTML = ""; $("#file").value = "";
  $("#pick").hidden = !live;
  $("#send").disabled = true; $("#send").hidden = !live;
  $("#veil").hidden = false;
}
function closeSheet() { if (busy) return; $("#veil").hidden = true; current = null; }

$("#list").addEventListener("click", e => { const b = e.target.closest("[data-id]"); if (b) openSheet(b.dataset.id); });
$("#q").addEventListener("input", render);
$("#close").addEventListener("click", closeSheet);
$("#veil").addEventListener("click", e => { if (e.target.id === "veil") closeSheet(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });
$("#file").addEventListener("change", e => {
  chosen = [...e.target.files];
  $("#files").innerHTML = chosen.map((f, i) => `<li><span class="n">${esc(f.name)}</span><span class="s" id="fs${i}">${mb(f.size)}</span><span class="bar" id="fb${i}"><i></i></span></li>`).join("");
  $("#send").disabled = !chosen.length; $("#sh-msg").innerHTML = "";
});

// Файл идёт прямо на Яндекс Диск по разовой ссылке, которую выдал ноутбук организаторов
function putDirect(url, method, file, onProg) {
  return new Promise((ok, bad) => {
    const x = new XMLHttpRequest();
    x.open(method || "PUT", url);
    x.upload.onprogress = e => e.lengthComputable && onProg(e.loaded);
    x.onload = () => x.status >= 200 && x.status < 300 ? ok() : bad(new Error("Яндекс Диск не принял файл (" + x.status + ")"));
    x.onerror = () => bad(new Error("Связь прервалась"));
    x.send(file);
  });
}
async function postJson(url, body) {
  const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || "Ошибка " + r.status);
  return j;
}
async function uploadFile(file, i) {
  const bar = $("#fb" + i).firstChild, size = $("#fs" + i);
  let st, tries = 0;
  for (;;) {
    try {
      st = await postJson(API + "/upload/start", { taskId: current.t.id, name: file.name, size: file.size });
      await putDirect(st.href, st.method, file, l => { bar.style.width = (l / file.size * 100) + "%"; size.textContent = `${mb(l)} из ${mb(file.size)}`; });
      break;
    } catch (e) { if (++tries > 2) throw e; size.textContent = "повторяю…"; await new Promise(z => setTimeout(z, 3000 * tries)); }
  }
  bar.style.width = "100%";
  let fin;
  for (let k = 0; ; k++) {
    try { fin = await postJson(`${API}/upload/${st.uploadId}/finish`, {}); break; }
    catch (e) { if (k >= 2) throw e; await new Promise(z => setTimeout(z, 4000)); }
  }
  $("#fb" + i).classList.add("done"); size.textContent = "загружено ✓";
  return fin;
}
$("#send").addEventListener("click", async () => {
  if (!chosen.length || busy) return;
  busy = true; $("#send").disabled = true; $("#pick").hidden = true; $("#sh-warn").hidden = false; $("#close").disabled = true;
  let last = null, failed = 0;
  for (let i = 0; i < chosen.length; i++) {
    try { last = await uploadFile(chosen[i], i); }
    catch (e) { failed++; $("#fb" + i).classList.add("err"); $("#fs" + i).textContent = e.message; }
  }
  busy = false; $("#sh-warn").hidden = true; $("#close").disabled = false;
  const msg = $("#sh-msg");
  if (last && !failed) msg.innerHTML = last.status === "late"
    ? `<div class="msg late">Работа сдана, но после дедлайна</div>` : `<div class="msg ok">Готово! Работа сдана вовремя ✓</div>`;
  else if (last) msg.innerHTML = `<div class="msg err">Часть файлов не загрузилась (${failed}). Выбери их и отправь ещё раз.</div>`;
  else msg.innerHTML = `<div class="msg err">Не получилось отправить. Проверь интернет и попробуй ещё раз.</div>`;
  $("#pick").hidden = false; chosen = []; $("#file").value = "";
  load();
});

load();
setInterval(() => { if (!busy) load(); }, 60000);
</script>
</body>
</html>
